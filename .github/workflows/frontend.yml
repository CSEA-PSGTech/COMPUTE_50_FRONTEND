name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_API_BASE_URL: https://kriyabackend.psgtech.ac.in/inf
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/compute50/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  docker:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: |
            VITE_BASE_PATH=${{ vars.VITE_BASE_PATH || '/compute50/' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://kriyabackend.psgtech.ac.in/inf' }}
            VITE_HACKATHON_EVENT_ID=${{ vars.VITE_HACKATHON_EVENT_ID || 'EVNT01' }}
            VITE_REQUIRE_GENERAL_FEE=${{ vars.VITE_REQUIRE_GENERAL_FEE || 'true' }}
            VITE_PAYMENT_PORTAL_URL=${{ vars.VITE_PAYMENT_PORTAL_URL }}
            VITE_PARTICIPANT_WHATSAPP_URL=${{ vars.VITE_PARTICIPANT_WHATSAPP_URL }}
            VITE_PAYMENT_EVENT_KEY=${{ vars.VITE_PAYMENT_EVENT_KEY || 'compute50' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max