name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "docker/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "Dockerfile"
      - ".dockerignore"
      - "nginx.conf"
      - "security-headers.conf"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/compute50/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  docker:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BASE_PATH=${{ vars.VITE_BASE_PATH || '/compute50/' }}
          tags: |
            ghcr.io/csea-psgtech/compute_50_frontend:latest
            ghcr.io/csea-psgtech/compute_50_frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Jenkins deployment
        env:
          JENKINS_WEBHOOK_TOKEN: ${{ secrets.JENKINS_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$JENKINS_WEBHOOK_TOKEN" ]; then
            echo "JENKINS_WEBHOOK_TOKEN not set - skipping deploy trigger"
            exit 0
          fi
          curl -fsS -k -X POST \
            "https://jendc.psgtech.ac.in/generic-webhook-trigger/invoke?token=${JENKINS_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"service":"compute50-frontend","image_tag":"${{ github.sha }}"}'